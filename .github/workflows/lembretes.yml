# Rotina diária dos lembretes no WhatsApp.
# O GitHub chama o endpoint do app todo dia às 9h de Brasília (12:00 UTC).
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      endereço do app, sem barra no final (ex.: https://pet.tudoemdia.blog.br)
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET do app
name: Lembretes diários

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a rotina de lembretes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets APP_URL e CRON_SECRET no repositório."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 300 --retry 2 --retry-delay 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/lembretes"
